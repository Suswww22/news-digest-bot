name: Daily news digest

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 = 台灣時間 08:00
  workflow_dispatch:

permissions:
  contents: write   # 把網頁與已推播紀錄 commit 回 repo
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 產生今日摘要
        run: python -m news_digest_bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}

      - name: 保存網頁與已推播紀錄
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site data/sent.db 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Daily digest $(date -u +%F)"
          git push

      - if: hashFiles('site/index.html') != ''
        uses: actions/configure-pages@v5
      - if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: hashFiles('site/index.html') != ''
        id: deploy
        uses: actions/deploy-pages@v4
